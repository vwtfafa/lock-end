countdown-notification: "<gold>[<red>EndLock<gold>] The End will be unlocked in <yellow>%time%<gold>."
countdown-lock-notification: "<gold>[<red>EndLock<gold>] The End will be locked in <yellow>%time%<gold>."

# History command
history-header-page: "<gold>[<red>EndLock<gold>] <yellow>Lock History (page %page%):"
