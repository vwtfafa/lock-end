# Countdown status
countdown-status-paused: "<gold>[<red>EndLock<gold>] Schedule is currently <red>paused<gold>."
countdown-status-active: "<gold>[<red>EndLock<gold>] Schedule is currently <green>active<gold>. Unlocking in: %time%"

# Grace period
grace-period-active: "<yellow>The End lock grace period is active - access will be blocked shortly."

# Extended statistics
