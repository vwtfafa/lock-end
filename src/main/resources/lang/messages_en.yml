# Preview notifications
preview-lock: "<yellow>The End will be locked in <aqua>%seconds% <yellow>seconds!"
preview-unlock: "<green>The End will be unlocked in <yellow>%seconds% <green>seconds!"

# Schedule pause/resume
schedule-paused: "<gold>[<red>EndLock<gold>] Scheduled unlock has been <red>paused<gold>. Use <yellow>/endlock resume<gold> to resume."
schedule-resumed: "<gold>[<red>EndLock<gold>] Scheduled unlock has been <green>resumed<gold>."
schedule-not-paused: "<gold>[<red>EndLock<gold>] The schedule is not currently paused."
