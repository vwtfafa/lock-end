reason-usage: "<red>Usage: /endlock reason <reason>"
reason-set: "<green>Lock reason set to: %reason%"
join-notification: "<gold>The End is currently locked."
evacuation-warning: "<yellow>You will be moved out of the End in <aqua>%seconds% <yellow>seconds because it is locked."
