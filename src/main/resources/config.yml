# EndLock Plugin Configuration
locked: false
language: en

# Update Checker
update-checker:
  enabled: true
  notify-ops: true
  notify-chat: true

# bStats Metrics
metrics:
  enabled: true

# Broadcast when End is locked/unlocked
broadcast:
  enabled: true
  use-actionbar: true
  notify-all: true

# Join notification when End is locked
join-notification:
  enabled: true

# Message format: MiniMessage tags supported (<red>, <bold>, etc.)
messages:
  use-minimessage: true

# Logging
logging:
  enabled: true
  log-file: "EndLock.log"
  log-attempts: true
  json-enabled: true
  json-file: "EndLock.jsonl"

# Test command
test-command:
  enabled: true

# Optional integrations (only active when the plugin is installed)
integrations:
  placeholderapi:
    enabled: true
  luckperms-context:
    enabled: true
  discordsrv:
    enabled: true
    channel-id: ""
