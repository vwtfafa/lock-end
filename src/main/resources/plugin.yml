name: EndLock
version: '${version}'
main: org.vwtfafa.lockEnd.LockEnd
api-version: '26.3'
description: >
  EndLock globally locks access to the End dimension via command (blocks /execute, /tp, plugins, etc.),
  is multilingual, permission-protected, and supports optional notifications, stats, and placeholders.
authors: [vwtfafa]
softdepend: [PlaceholderAPI]
# Commands are registered programmatically as a native Brigadier command
# tree via Paper's lifecycle API (see EndLockCommand#buildNode):
# /endlock with aliases /lock and /el.
permissions:
  endlock.reload:
    description: Reloads the plugin configuration without a server restart
    default: op
  endlock.admin:
    description: Receive broadcast notifications and use test command
    default: op
  endlock.toggle:
    description: Toggle lock state (no arguments)
    default: op
  endlock.whitelist.bypass:
    description: Bypass the End lock via whitelist
    default: op
  # Dynamic per-world bypass permissions (endlock.bypass.world.<worldname>)
  # are granted per world via permission plugins; no wildcard node exists.
  endlock.history:
    description: View lock history
    default: op
  endlock.undo:
    description: Undo the last lock/unlock action
    default: op
  endlock.validate:
    description: Validate configuration file
    default: op
