name: EndLock
version: '${version}'
author: vwtfafa
main: org.vwtfafa.lockEnd.LockEnd
api-version: '26.2'
description: Lock or unlock End access globally. Scheduled unlocks, PlaceholderAPI, stats, and extended logging.
softdepend: [PlaceholderAPI, LuckPerms, DiscordSRV]
commands:
  endlock:
    description: Lock, unlock, or schedule access to the End dimension
    usage: /endlock [lock|unlock|status|stats|unlockin|unlockat|export|test]
  lock:
    description: Alias for /endlock
    usage: /lock [lock|unlock|status|stats|unlockin|unlockat]
permissions:
  endlock.toggle:
    description: Allows locking or unlocking the End
    default: op
  endlock.admin:
    description: Receive admin notifications, export logs, and use test command
    default: op
