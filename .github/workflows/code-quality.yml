name: Code Quality Checks

on:
  push:
    branches: [master, beta, v2.0, feature/multiplatform-core]
  pull_request:
    branches: [master, beta]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Gradle checks
        run: |
          ./gradlew build --no-daemon --stacktrace

      - name: Validate Datapack resources explicitly
        run: |
          ./gradlew :datapack:validatePack --no-daemon --stacktrace

      - name: Build shared API javadoc
        run: |
          ./gradlew :lock-end-api:javadoc --no-daemon --stacktrace

      - name: Smoke test on pinned Paper 26.3 Build 209
        # Heavy server smokes run only for pushes to the main integration
        # branches; feature-branch pushes and PRs get the light build+test
        # pipeline so CI stays fast during development.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/beta')
        run: |
          mkdir -p smoke-paper/plugins
          curl --fail --location --retry 3 \
            https://fill-data.papermc.io/v1/objects/0a056c7648cfa0ca8d9b8c833a2bd2e1313ed4f1393a5125dd3444a4ee257e22/paper-26.3-209.jar \
            --output smoke-paper/paper.jar
          echo "0a056c7648cfa0ca8d9b8c833a2bd2e1313ed4f1393a5125dd3444a4ee257e22  smoke-paper/paper.jar" \
            | sha256sum --check
          cp platforms/paper/build/libs/lock-end-*.jar smoke-paper/plugins/EndLock.jar
          printf 'eula=true\n' > smoke-paper/eula.txt
          cat > smoke-paper/server.properties <<'EOF'
          online-mode=false
          server-port=25575
          enable-query=false
          enable-rcon=false
          spawn-protection=0
          EOF
          cd smoke-paper
          mkfifo console
          exec 3<>console
          java -jar paper.jar --nogui < console > server.log 2>&1 &
          server_pid=$!
          cleanup() {
            printf 'stop\n' >&3 || true
            for attempt in $(seq 1 30); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                wait "$server_pid" || true
                return
              fi
              sleep 1
            done
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if grep -Fq 'EndLock v' server.log && grep -Fq 'enabled (Paper 26.3+)' server.log; then
              printf 'endlock history status\n' >&3
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          for attempt in $(seq 1 30); do
            if grep -Fq 'History storage:' server.log; then
              echo "EndLock loaded and history status command responded on Paper 26.3 Build 209."
              exit 0
            fi
            sleep 1
          done
          cat server.log
          echo "Paper smoke test did not observe the history status response."
          exit 1

      - name: Smoke test on pinned Folia 26.3 Build 5 (ALPHA)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/beta')
        run: |
          mkdir -p smoke-folia/plugins
          curl --fail --location --retry 3 \
            https://fill-data.papermc.io/v1/objects/c105f6be9463b2da37568b620e81b9ab2f6a6ae771f8fff9caf7a1c0946b340a/folia-26.3-5.jar \
            --output smoke-folia/folia.jar
          echo "c105f6be9463b2da37568b620e81b9ab2f6a6ae771f8fff9caf7a1c0946b340a  smoke-folia/folia.jar" \
            | sha256sum --check
          cp platforms/paper/build/libs/lock-end-*.jar smoke-folia/plugins/EndLock.jar
          printf 'eula=true\n' > smoke-folia/eula.txt
          cat > smoke-folia/server.properties <<'EOF'
          online-mode=false
          server-port=25576
          enable-query=false
          enable-rcon=false
          spawn-protection=0
          EOF
          cd smoke-folia
          mkfifo console
          exec 3<>console
          java -jar folia.jar --nogui < console > server.log 2>&1 &
          server_pid=$!
          cleanup() {
            printf 'stop\n' >&3 || true
            for attempt in $(seq 1 30); do
              if ! kill -0 "$server_pid" 2>/dev/null; then
                wait "$server_pid" || true
                return
              fi
              sleep 1
            done
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 120); do
            if grep -Fq 'EndLock v' server.log && grep -Fq 'enabled (Paper 26.3+)' server.log; then
              printf 'endlock history status\n' >&3
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          for attempt in $(seq 1 30); do
            if grep -Fq 'History storage:' server.log; then
              printf 'endlock stats\n' >&3
              break
            fi
            sleep 1
          done
          for attempt in $(seq 1 30); do
            if grep -Fq 'Blocked count' server.log; then
              if grep -Fq '%blockedcount%' server.log; then
                cat server.log
                echo "Folia smoke test observed an unsubstituted placeholder."
                exit 1
              fi
              echo "EndLock loaded and command responses were healthy on Folia 26.3 Build 5 (ALPHA)."
              exit 0
            fi
            sleep 1
          done
          cat server.log
          echo "Folia smoke test did not observe the stats response."
          exit 1

      - name: Archive Checkstyle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkstyle-report
          path: platforms/paper/build/reports/checkstyle/main/*.xml

      - name: Archive SpotBugs report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs-report
          path: platforms/paper/build/reports/spotbugs/main/*.xml

      - name: Archive release artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            platforms/paper/build/libs/lock-end-*.jar
            platforms/fabric/build/libs/lock-end-fabric-*.jar
            platforms/neoforge/build/libs/lock-end-neoforge-*.jar
            datapack/build/libs/lock-end-datapack-*.zip
          if-no-files-found: error

      - name: Archive API javadoc
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-javadoc
          path: lock-end-api/build/docs/javadoc/
          if-no-files-found: error

  smoke-fabric:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/beta')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Bounded dev-server smoke: the boot must log the mod init line. The
      # vanilla dedicated server shuts itself down once stdin reaches EOF
      # (CI stdin is /dev/null), so no stop signal has to be fed through
      # Gradle; timeout 900 is only a safety net for hangs.
      - name: Boot smoke test on Fabric (dev dedicated server)
        env:
          LOCKEND_FASTSTATS_TOKEN: ${{ secrets.LOCKEND_FASTSTATS_TOKEN }}
        run: |
          mkdir -p platforms/fabric/run
          printf 'eula=true\n' > platforms/fabric/run/eula.txt
          timeout 900 ./gradlew :platforms:fabric:runServer --no-daemon --console=plain < /dev/null > fabric-run.log 2>&1 || true
          grep -Fq 'EndLock (Fabric) initialized' fabric-run.log || {
            cat fabric-run.log
            echo "Fabric smoke test did not observe the EndLock init line."
            exit 1
          }
          grep -Fq 'FastStats metrics and error tracking enabled.' fabric-run.log || {
            cat fabric-run.log
            echo "Fabric smoke test did not observe the FastStats activation line."
            exit 1
          }
          echo "EndLock (Fabric) booted on the dev dedicated server."

  smoke-neoforge:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/beta')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Bounded dev-server smoke mirroring the Fabric job above: stdin EOF
      # terminates the dedicated server, timeout 900 is the hang safety net.
      - name: Boot smoke test on NeoForge (dev dedicated server)
        env:
          LOCKEND_FASTSTATS_TOKEN: ${{ secrets.LOCKEND_FASTSTATS_TOKEN }}
        run: |
          mkdir -p platforms/neoforge/run
          printf 'eula=true\n' > platforms/neoforge/run/eula.txt
          timeout 900 ./gradlew :platforms:neoforge:runServer --no-daemon --console=plain < /dev/null > neoforge-run.log 2>&1 || true
          grep -Fq 'EndLock (NeoForge) initialized' neoforge-run.log || {
            cat neoforge-run.log
            echo "NeoForge smoke test did not observe the EndLock init line."
            exit 1
          }
          grep -Fq 'FastStats metrics and error tracking enabled.' neoforge-run.log || {
            cat neoforge-run.log
            echo "NeoForge smoke test did not observe the FastStats activation line."
            exit 1
          }
          echo "EndLock (NeoForge) booted on the dev dedicated server."
