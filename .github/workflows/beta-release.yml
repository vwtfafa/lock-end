name: Build and Release (Beta)

on:
  push:
    branches:
      - beta

permissions:
  contents: write

jobs:
  beta-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "^version = " build.gradle | sed "s/version = '//;s/'//")
          BETA_TAG="v${VERSION}-beta"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "beta_tag=$BETA_TAG" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Verify JAR exists
        run: test -f "build/libs/lock-end-${{ steps.version.outputs.version }}.jar"

      - name: Generate changelog since last stable release
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v beta | head -n 1)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "## Changes since ${PREV_TAG}" > changelog-section.md
          echo "" >> changelog-section.md
          git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges >> changelog-section.md

      - name: Prepare beta release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BETA_TAG: ${{ steps.version.outputs.beta_tag }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat > release-body.md <<EOF
          ## Lock-End ${BETA_TAG}

          **Experimental build** — not recommended for production.

          **Requirements:** Paper 26.2+, Java 25

          Download \`lock-end-${VERSION}.jar\` below.

          EOF
          cat changelog-section.md >> release-body.md
          cat >> release-body.md <<EOF

          ---

          [Full changelog](https://github.com/${{ github.repository }}/blob/beta/CHANGELOG.md) · [Report issues](https://github.com/${{ github.repository }}/issues/new/choose)

          *Built from \`${{ github.sha }}\` on ${BUILD_DATE}.*
          EOF

      - name: Delete old numbered beta tags
        run: |
          git fetch origin --tags --force
          OLD_TAGS=$(git tag -l | grep -E 'v[0-9]+\.[0-9]+-beta\.[0-9]+$' || true)
          if [ -n "$OLD_TAGS" ]; then
            echo "$OLD_TAGS" | while read TAG; do
              git push origin --delete "$TAG" 2>/dev/null || true
            done
          fi

      - name: Create or replace single beta pre-release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.beta_tag }}
          commit: ${{ github.sha }}
          name: Lock-End ${{ steps.version.outputs.beta_tag }} (Beta)
          bodyFile: release-body.md
          artifacts: build/libs/lock-end-${{ steps.version.outputs.version }}.jar
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: false
          prerelease: true
          makeLatest: false
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}
