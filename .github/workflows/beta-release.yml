name: Build and Release (Beta)

on:
  push:
    branches:
      - beta

permissions:
  contents: write

jobs:
  beta-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Extract version and create beta tag
        id: version
        run: |
          VERSION=$(awk -F"'" '/^version = /{print $2; exit}' build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          BETA_TAG="v${VERSION}-beta"
          echo "beta_tag=$BETA_TAG" >> "$GITHUB_OUTPUT"
          echo "Building beta version $BETA_TAG"

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Verify JAR exists
        run: test -f "build/libs/lock-end-${{ steps.version.outputs.version }}.jar"

      - name: Prepare beta release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BETA_TAG: ${{ steps.version.outputs.beta_tag }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat > release-body.md <<EOF
          ## 🔒 Lock-End ${BETA_TAG} (Beta)

          ⚠️ **This is a BETA / DEVELOPMENT release** — Use at your own risk!

          **Requirements:** Paper 26.2+, Java 25

          ### Download

          Download \`lock-end-${VERSION}.jar\` below and place it in your server's \`plugins/\` folder.

          ### Changes

          See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/beta/CHANGELOG.md) for new features and fixes in this beta.

          ### Testing & Feedback

          Found a bug? Please [open an issue](https://github.com/${{ github.repository }}/issues/new).

          ---
          *Built automatically from commit ${{ github.sha }} on ${BUILD_DATE}.*
          EOF

      - name: Create or update GitHub Pre-Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.beta_tag }}
          commit: ${{ github.sha }}
          name: Lock-End ${{ steps.version.outputs.beta_tag }} (Beta)
          bodyFile: release-body.md
          artifacts: build/libs/lock-end-${{ steps.version.outputs.version }}.jar
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: false
          prerelease: true
          makeLatest: false
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}
