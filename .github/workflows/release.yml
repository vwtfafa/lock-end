name: Build and Release

on:
  push:
    branches:
      - master
      - beta
      - v2.0

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read release configuration
        id: config
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          CONFIG=".github/release-config.yml"

          if [ ! -f "$CONFIG" ]; then
            echo "ERROR: $CONFIG not found"
            exit 1
          fi

          CONFIG_LINE=$(awk -v branch="$BRANCH" '
            $0 ~ "^  " branch ":$" {
              found=1
              next
            }
            found && /^  [a-zA-Z0-9._-]+:$/ {
              exit
            }
            found && /type:/ {
              type=$2
            }
            found && /paper:/ {
              paper=$2
              gsub(/"/, "", paper)
            }
            found && /java:/ {
              java=$2
              gsub(/"/, "", java)
            }
            END {
              if (found && type != "" && paper != "" && java != "")
                print type "|" paper "|" java
            }
          ' "$CONFIG")

          if [ -z "$CONFIG_LINE" ]; then
            echo "ERROR: No valid configuration found for branch '$BRANCH'"
            exit 1
          fi

          IFS='|' read -r TYPE PAPER JAVA <<< "$CONFIG_LINE"

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "paper=$PAPER" >> "$GITHUB_OUTPUT"
          echo "java=$JAVA" >> "$GITHUB_OUTPUT"

          echo "Branch: $BRANCH"
          echo "Release type: $TYPE"
          echo "Paper: $PAPER"
          echo "Java: $JAVA"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "${{ steps.config.outputs.java }}"
          distribution: temurin
          cache: gradle

      - name: Extract version
        id: version
        run: |
          # The version lives in gradle.properties (lockEndVersion) since the
          # multiplatform monorepo migration; there is no root build.gradle.kts
          # anymore. The Paper conventions plugin feeds it into plugin.yml via
          # project.version, so one source stays authoritative.
          VERSION=$(grep '^lockEndVersion=' gradle.properties | head -1 | sed 's/^lockEndVersion=//' | tr -d ' \r')

          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from gradle.properties"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Verify release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PAPER_ARTIFACT="platforms/paper/build/libs/lock-end-${VERSION}.jar"
          FABRIC_ARTIFACT="platforms/fabric/build/libs/lock-end-fabric-${VERSION}.jar"
          NEOFORGE_ARTIFACT="platforms/neoforge/build/libs/lock-end-neoforge-${VERSION}.jar"
          DATAPACK_ARTIFACT="datapack/build/libs/lock-end-datapack-${VERSION}.zip"

          for ARTIFACT in "$PAPER_ARTIFACT" "$FABRIC_ARTIFACT" "$NEOFORGE_ARTIFACT" "$DATAPACK_ARTIFACT"; do
            if [ ! -f "$ARTIFACT" ]; then
              echo "ERROR: Expected release artifact not found:"
              echo "$ARTIFACT"
              echo
              echo "Available files:"
              ls -la platforms/*/build/libs/ datapack/build/libs/ 2>/dev/null || true
              exit 1
            fi
            echo "Found: $ARTIFACT"
          done

          jar tf "$PAPER_ARTIFACT" | grep -Fxq "plugin.yml"
          for language in de en es fr it ja ru zh; do
            jar tf "$PAPER_ARTIFACT" | grep -Fxq "lang/messages_${language}.yml"
          done
          PLUGIN_YML=$(unzip -p "$PAPER_ARTIFACT" plugin.yml)
          printf '%s\n' "$PLUGIN_YML" | grep -Fxq "version: '${VERSION}'"
          printf '%s\n' "$PLUGIN_YML" | grep -Fxq "api-version: '26.3'"
          printf '%s\n' "$PLUGIN_YML" | grep -Fxq "main: org.vwtfafa.lockEnd.LockEnd"
          echo "Plugin descriptor and all language resources verified."

          jar tf "$FABRIC_ARTIFACT" | grep -Fxq "fabric.mod.json"
          jar tf "$FABRIC_ARTIFACT" | grep -Fxq "META-INF/THIRD-PARTY-NOTICES.md"
          FABRIC_JSON=$(unzip -p "$FABRIC_ARTIFACT" fabric.mod.json)
          printf '%s\n' "$FABRIC_JSON" | grep -Eq "\"version\"[[:space:]]*:[[:space:]]*\"${VERSION}\""
          echo "Fabric mod descriptor verified."

          jar tf "$NEOFORGE_ARTIFACT" | grep -Fxq "META-INF/neoforge.mods.toml"
          NEOFORGE_TOML=$(unzip -p "$NEOFORGE_ARTIFACT" META-INF/neoforge.mods.toml)
          printf '%s\n' "$NEOFORGE_TOML" | grep -Eq "(^|[[:space:]])version=['\"]${VERSION}['\"]"
          echo "NeoForge mod descriptor verified."

          unzip -p "$DATAPACK_ARTIFACT" pack.mcmeta | grep -Eq "min_format|pack_format"
          for function in lock unlock status set_spawn; do
            unzip -Z1 "$DATAPACK_ARTIFACT" | grep -Fxq "data/lockend/function/${function}.mcfunction"
          done
          echo "Datapack zip verified."

      - name: Prepare release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PAPER: ${{ steps.config.outputs.paper }}
          JAVA: ${{ steps.config.outputs.java }}
          TYPE: ${{ steps.config.outputs.type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          git fetch --tags --force --quiet || true

          # Base the change list on the most recent stable GitHub release so beta
          # notes list everything that changed since the last stable release
          # instead of shrinking to the commits of the latest push.
          BASE_TAG=""
          BASE_LABEL="the initial commit"

          STABLE_TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' 2>/dev/null || true)

          while IFS= read -r CANDIDATE; do
            if [ -n "$CANDIDATE" ] && git rev-parse -q --verify "refs/tags/${CANDIDATE}" >/dev/null; then
              BASE_TAG="$CANDIDATE"
              BASE_LABEL=$(printf 'the last stable release (`%s`)' "$CANDIDATE")
              break
            fi
          done <<< "$STABLE_TAGS"

          if [ -z "$BASE_TAG" ]; then
            BASE_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

            if [ -n "$BASE_TAG" ]; then
              BASE_LABEL=$(printf 'the last release (`%s`)' "$BASE_TAG")
            fi
          fi

          if [ -n "$BASE_TAG" ]; then
            CHANGELOG=$(git log --no-merges --pretty=format:"- %s" "${BASE_TAG}..HEAD")

            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- No changes since ${BASE_LABEL}"
            fi
          else
            CHANGELOG="- Initial release"
          fi

          case "$TYPE" in
            stable)
              TITLE="${VERSION}"
              WARNING=""
              ;;
            beta)
              TITLE="v${VERSION}-beta"
              WARNING="⚠️ **This is a BETA / DEVELOPMENT release.** Use it for testing and report any bugs you find."
              ;;
            test)
              TITLE="${VERSION}-${BRANCH}"
              WARNING="⚠️ **This is a TEST release.** It is intended for compatibility testing."
              ;;
            *)
              echo "ERROR: Unknown release type '$TYPE'"
              exit 1
              ;;
          esac

          awk -v VERSION="$VERSION" \
            -v TITLE="$TITLE" \
            -v WARNING="$WARNING" \
            -v PAPER="$PAPER" \
            -v JAVA="$JAVA" \
            -v BRANCH="$BRANCH" \
            -v BASE_LABEL="$BASE_LABEL" \
            -v CHANGELOG="$CHANGELOG" \
            -v GITHUB_SHA="$GITHUB_SHA" \
            -v BUILD_DATE="$BUILD_DATE" \
            'function escape_replacement(value) {
              gsub(/\\/, "\\\\", value);
              gsub(/&/, "\\&", value);
              return value;
            }
            {
              gsub(/@VERSION@/, escape_replacement(VERSION));
              gsub(/@TITLE@/, escape_replacement(TITLE));
              gsub(/@WARNING@/, escape_replacement(WARNING));
              gsub(/@PAPER@/, escape_replacement(PAPER));
              gsub(/@JAVA@/, escape_replacement(JAVA));
              gsub(/@BRANCH@/, escape_replacement(BRANCH));
              gsub(/@BASE_LABEL@/, escape_replacement(BASE_LABEL));
              gsub(/@CHANGELOG@/, escape_replacement(CHANGELOG));
              gsub(/@GITHUB_SHA@/, escape_replacement(GITHUB_SHA));
              gsub(/@BUILD_DATE@/, escape_replacement(BUILD_DATE));
              print
            }' .github/RELEASE_TEMPLATE.md > release-body.md

          echo "Release body:"
          cat release-body.md

      - name: Determine release tag
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TYPE: ${{ steps.config.outputs.type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$TYPE" in
            stable)
              TAG="v${VERSION}"
              ;;
            beta)
              TAG="v${VERSION}-beta"
              ;;
            test)
              TAG="v${VERSION}-${BRANCH}"
              ;;
            *)
              echo "ERROR: Unknown release type '$TYPE'"
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          TYPE: ${{ steps.config.outputs.type }}
        run: |
          PAPER_ARTIFACT="platforms/paper/build/libs/lock-end-${VERSION}.jar"
          FABRIC_ARTIFACT="platforms/fabric/build/libs/lock-end-fabric-${VERSION}.jar"
          NEOFORGE_ARTIFACT="platforms/neoforge/build/libs/lock-end-neoforge-${VERSION}.jar"
          DATAPACK_ARTIFACT="datapack/build/libs/lock-end-datapack-${VERSION}.zip"

          if [ "$TYPE" = "stable" ]; then
            PRERELEASE=false
            LATEST=true
          else
            PRERELEASE=true
            LATEST=false
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release: $TAG"

            gh release upload \
              "$TAG" \
              "$PAPER_ARTIFACT" \
              "$FABRIC_ARTIFACT" \
              "$NEOFORGE_ARTIFACT" \
              "$DATAPACK_ARTIFACT" \
              --clobber

            gh release edit \
              "$TAG" \
              --notes-file release-body.md \
              --prerelease="$PRERELEASE" \
              --latest="$LATEST"
          else
            echo "Creating release: $TAG"

            gh release create \
              "$TAG" \
              "$PAPER_ARTIFACT" \
              "$FABRIC_ARTIFACT" \
              "$NEOFORGE_ARTIFACT" \
              "$DATAPACK_ARTIFACT" \
              --title "Lock-End ${TAG}" \
              --notes-file release-body.md \
              --prerelease="$PRERELEASE" \
              --latest="$LATEST" \
              --target "$GITHUB_SHA"
          fi

          echo "Moving $TAG to $GITHUB_SHA"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG" --force

      - name: Delete beta tags after stable release
        if: steps.config.outputs.type == 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin --tags --force

          BETA_TAGS=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-beta(\.[0-9]+)?$' || true)

          if [ -z "$BETA_TAGS" ]; then
            echo "No beta tags found"
            exit 0
          fi

          echo "$BETA_TAGS" | while read -r TAG; do
            echo "Deleting beta tag: $TAG"
            git push origin --delete "$TAG" || true
          done

          echo "All beta tags have been deleted"