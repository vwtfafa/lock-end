      - name: Prepare release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PAPER: ${{ steps.config.outputs.paper }}
          JAVA: ${{ steps.config.outputs.java }}
          TYPE: ${{ steps.config.outputs.type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" "${LAST_TAG}..HEAD")

            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="- No changes since last release"
            fi
          else
            CHANGELOG="- Initial release"
          fi

          case "$TYPE" in
            stable)
              TITLE="${VERSION}"
              WARNING=""
              ;;
            beta)
              TITLE="v${VERSION}-beta"
              WARNING="⚠️ **This is a BETA / DEVELOPMENT release.** Use it for testing and report any bugs you find."
              ;;
            test)
              TITLE="${VERSION}-${BRANCH}"
              WARNING="⚠️ **This is a TEST release.** It is intended for compatibility testing."
              ;;
            *)
              echo "ERROR: Unknown release type '$TYPE'"
              exit 1
              ;;
          esac

          # Escape values for sed replacement
          ESCAPED_VERSION=$(printf '%s' "$VERSION" | sed 's/[&|\\]/\\&/g')
          ESCAPED_TITLE=$(printf '%s' "$TITLE" | sed 's/[&|\\]/\\&/g')
          ESCAPED_WARNING=$(printf '%s' "$WARNING" | sed 's/[&|\\]/\\&/g')
          ESCAPED_PAPER=$(printf '%s' "$PAPER" | sed 's/[&|\\]/\\&/g')
          ESCAPED_JAVA=$(printf '%s' "$JAVA" | sed 's/[&|\\]/\\&/g')
          ESCAPED_BRANCH=$(printf '%s' "$BRANCH" | sed 's/[&|\\]/\\&/g')
          ESCAPED_CHANGELOG=$(printf '%s' "$CHANGELOG" | sed 's/[&|\\]/\\&/g')
          ESCAPED_SHA=$(printf '%s' "$GITHUB_SHA" | sed 's/[&|\\]/\\&/g')
          ESCAPED_BUILD_DATE=$(printf '%s' "$BUILD_DATE" | sed 's/[&|\\]/\\&/g')

          sed \
            -e "s|@VERSION@|${ESCAPED_VERSION}|g" \
            -e "s|@TITLE@|${ESCAPED_TITLE}|g" \
            -e "s|@WARNING@|${ESCAPED_WARNING}|g" \
            -e "s|@PAPER@|${ESCAPED_PAPER}|g" \
            -e "s|@JAVA@|${ESCAPED_JAVA}|g" \
            -e "s|@BRANCH@|${ESCAPED_BRANCH}|g" \
            -e "s|@CHANGELOG@|${ESCAPED_CHANGELOG}|g" \
            -e "s|@GITHUB_SHA@|${ESCAPED_SHA}|g" \
            -e "s|@BUILD_DATE@|${ESCAPED_BUILD_DATE}|g" \
            .github/RELEASE_TEMPLATE.md > release-body.md

          echo "Release body:"
          cat release-body.md