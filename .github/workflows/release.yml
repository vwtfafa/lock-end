name: Build and Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Extract version
        id: version
        run: |
          VERSION=$(awk -F"'" '/^version = /{print $2; exit}' build.gradle)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Verify JAR exists
        run: test -f "build/libs/lock-end-${{ steps.version.outputs.version }}.jar"

      - name: Prepare release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" ${LAST_TAG}..HEAD)
          else
            CHANGELOG="- Initial release"
          fi
          if [ -f .github/RELEASE_TEMPLATE.md ]; then
            cat > release-body.md <<EOF
          ## 🔒 Lock-End ${VERSION}

          **Requirements:** Paper 26.2+, Java 25

          Download \`lock-end-${VERSION}.jar\` below and place it in your server's \`plugins/\` folder.

          See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for commands and configuration.

          ### Changes
          ${CHANGELOG}

          ---
          *Built automatically from commit ${{ github.sha }} on ${BUILD_DATE}.*
          EOF
          else
            cat > release-body.md <<EOF
          ## 🔒 Lock-End ${VERSION}

          **Requirements:** Paper 26.2+, Java 25

          Download \`lock-end-${VERSION}.jar\` below and place it in your server's \`plugins/\` folder.

          See the [README](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for commands and configuration.

          ---
          *Built automatically from commit ${{ github.sha }} on ${BUILD_DATE}.*
          EOF
          fi

      - name: Point release tag at this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.version }}"
          git tag -fa "$TAG" -m "Release $TAG"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$TAG" --force

      - name: Delete all beta tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          BETA_TAGS=$(git tag -l | grep -E 'v[0-9]+\.[0-9]+-beta\.[0-9]+' || true)
          if [ -z "$BETA_TAGS" ]; then
            echo "✓ No beta tags found to delete"
            exit 0
          fi
          echo "$BETA_TAGS" | while read -r TAG; do
            git tag -d "$TAG" 2>/dev/null || true
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" --delete "$TAG" 2>/dev/null || true
          done
          echo "✓ All beta tags have been deleted"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          ARTIFACT=$(find build/libs -maxdepth 1 -type f -name 'lock-end-*.jar' | head -n 1)
          if [ -z "$ARTIFACT" ]; then
            echo "No plugin jar found in build/libs"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARTIFACT" --clobber
            gh release edit "$TAG" --title "Lock-End ${VERSION}" --notes-file release-body.md --latest
          else
            gh release create "$TAG" "$ARTIFACT" --title "Lock-End ${VERSION}" --notes-file release-body.md --latest
          fi
