name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "^version = " build.gradle | head -n 1 | cut -d"'" -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Verify JAR exists
        run: test -f "build/libs/lock-end-${{ steps.version.outputs.version }}.jar"

      - name: Prepare release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" ${LAST_TAG}..HEAD)
          else
            CHANGELOG="- Initial release"
          fi
          if [ -f .github/RELEASE_TEMPLATE.md ]; then
            cat > release-body.md <<EOF
          ## 🔒 Lock-End ${VERSION}

          **Requirements:** Paper 26.2+, Java 25

          Download \`lock-end-${VERSION}.jar\` below and place it in your server's \`plugins/\` folder.

          See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for commands and configuration.

          ### Changes
          ${CHANGELOG}

          ---
          *Built automatically from commit ${{ github.sha }} on ${BUILD_DATE}.*
          EOF
          else
            cat > release-body.md <<EOF
          ## 🔒 Lock-End ${VERSION}

          **Requirements:** Paper 26.2+, Java 25

          Download \`lock-end-${VERSION}.jar\` below and place it in your server's \`plugins/\` folder.

          See the [README](https://github.com/${{ github.repository }}/blob/main/README.md) for commands and configuration.

          ---
          *Built automatically from commit ${{ github.sha }} on ${BUILD_DATE}.*
          EOF
          fi

      - name: Point release tag at this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.version }}"
          git tag -fa "$TAG" -m "Release $TAG"
          git push origin "$TAG" --force

      - name: Delete all beta tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Fetch all tags from remote
          git fetch origin --tags --force
          
          # Find and delete all beta tags
          BETA_TAGS=$(git tag -l | grep -E 'v[0-9]+\.[0-9]+-beta\.[0-9]+')
          
          if [ -z "$BETA_TAGS" ]; then
            echo "✓ No beta tags found to delete"
            exit 0
          fi
          
          echo "Found beta tags to delete:"
          echo "$BETA_TAGS"
          
          # Delete locally and remotely
          echo "$BETA_TAGS" | while read TAG; do
            git tag -d "$TAG"
            git push origin --delete "$TAG" || echo "Note: Tag $TAG may not exist on remote"
          done
          
          echo "✓ All beta tags have been deleted"

      - name: Create or fully overwrite GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          commit: ${{ github.sha }}
          name: Lock-End ${{ steps.version.outputs.version }}
          bodyFile: release-body.md
          artifacts: build/libs/lock-end-${{ steps.version.outputs.version }}.jar
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: false
          generateReleaseNotes: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
