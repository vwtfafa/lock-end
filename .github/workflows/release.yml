name: Build and Release

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: gradle

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "^version = " build.gradle | sed "s/version = '//;s/'//")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build with Gradle
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Verify JAR exists
        run: test -f "build/libs/lock-end-${{ steps.version.outputs.version }}.jar"

      - name: Generate changelog since last release
        id: changelog
        run: |
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v beta | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "## Changes since ${PREV_TAG}" > changelog-section.md
          echo "" >> changelog-section.md
          git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges >> changelog-section.md || echo "- Initial release" >> changelog-section.md
          echo "" >> changelog-section.md

      - name: Prepare release body
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          if [ -f .github/RELEASE_TEMPLATE.md ]; then
            sed \
              -e "s/@VERSION@/${VERSION}/g" \
              -e "s/@GITHUB_SHA@/${{ github.sha }}/g" \
              -e "s/@BUILD_DATE@/${BUILD_DATE}/g" \
              .github/RELEASE_TEMPLATE.md > release-body.md
          else
            echo "## Lock-End ${VERSION}" > release-body.md
          fi
          echo "" >> release-body.md
          cat changelog-section.md >> release-body.md

      - name: Point release tag at this commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.version }}"
          git tag -fa "$TAG" -m "Release $TAG"
          git push origin "$TAG" --force

      - name: Delete all beta tags
        run: |
          git fetch origin --tags --force
          BETA_TAGS=$(git tag -l | grep -E 'v[0-9]+\.[0-9]+-beta(\.[0-9]+)?$' || true)
          if [ -n "$BETA_TAGS" ]; then
            echo "$BETA_TAGS" | while read TAG; do
              git tag -d "$TAG" 2>/dev/null || true
              git push origin --delete "$TAG" 2>/dev/null || true
            done
          fi

      - name: Create or fully overwrite GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          commit: ${{ github.sha }}
          name: Lock-End ${{ steps.version.outputs.version }}
          bodyFile: release-body.md
          artifacts: build/libs/lock-end-${{ steps.version.outputs.version }}.jar
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: false
          generateReleaseNotes: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
