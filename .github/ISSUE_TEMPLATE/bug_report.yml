name: Bug report
description: Report a problem with EndLock
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include as much detail as possible.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 1.5.0
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server software
      placeholder: Paper 26.2
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What happened?
      placeholder: Describe the bug and steps to reproduce it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      placeholder: Paste relevant console or plugin logs here.
