name: Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check [existing issues](https://github.com/vwtfafa/lock-end/issues) first.
        Include your Paper version, Java version, and EndLock version.

  - type: input
    id: version
    attributes:
      label: EndLock version
      placeholder: "4.0"
    validations:
      required: true

  - type: input
    id: paper
    attributes:
      label: Paper version
      placeholder: "26.2"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /endlock lock
        2. Enter End portal
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server log snippet or plugins/EndLock/logs/ content
      render: shell
