name: Feature Request
description: Suggest an idea for EndLock
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: e.g. I want to notify Discord when someone tries to enter the End while locked
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional — other ways you've thought about solving this

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Commands / gameplay
        - Integrations (PlaceholderAPI, Discord, etc.)
        - Configuration / messages
        - Logging / statistics
        - Other
